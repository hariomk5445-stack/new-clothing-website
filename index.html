<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChicVogue - Curated Affiliate Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home-view" class="view active">
        <header>
            <h1 class="logo">ChicVogue</h1>
        </header>

        <div class="banner-container" onclick="showDetail('banner-special')">
            <span class="badge">MEGA DEAL</span>
            <h2>Exclusive Festive Combo Offer</h2>
            <p>Tap to view special curated collection &rarr;</p>
        </div>

        <!-- 🔽 Sab sections yahan AUTOMATIC ban jaayenge. Kuch mat likhna. -->
        <div id="sections-container"></div>

        <footer>
            <p>&copy; 2026 ChicVogue. Curated Affiliate Store.</p>
        </footer>
    </div>

    <div id="detail-view" class="view">
        <div class="detail-container">
            <button class="back-btn" onclick="showHome()">&larr; Back to Shop</button>
            <div class="detail-grid">
                <div class="detail-img-box">
                    <span id="detail-badge" class="badge"></span>
                    <img id="detail-img" src="" alt="Product">
                </div>
                <div class="detail-info">
                    <h2 id="detail-title"></h2>
                    <div class="detail-price-box">
                        <span id="detail-price" class="current-price"></span>
                        <span id="detail-original" class="original-price"></span>
                    </div>
                    <p id="detail-desc"></p>
                    <a id="buy-now-btn" href="#" target="_blank" class="buy-btn">Grab Deal on Store</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Data file pehle, phir logic file -->
    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
